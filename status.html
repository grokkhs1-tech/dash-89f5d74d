function render(d,m){const n=d.naver;a.innerHTML=`<div class=c><div class=l>NAVER 현재가</div><div class=v>${f(n.price)}원</div></div>

<div class=c><div class=l>손실여유 (한도 -300,000)</div><div class=v>${f(d.lossRoom)}원</div></div>
${[['코스피','kospi'],['코스닥','kosdaq'],['나스닥선물','nq'],['S&P선물','es']].map(([k,v])=>`<div class=c><div class=l>${k}</div><div class="v ${cl(d[v])}">${sg(d[v])}%</div></div>`).join('')}</div>
